<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blockendance - Blockchain Attendance System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/materialize.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">
</head>

<body class="blue-grey lighten-4">

    <div class="container">

        <!-- HEADER -->
        <div class="row">
            <div class="col s12 center-align">

                <h3 class="blue-grey-text text-darken-2">
                    <i class="material-icons large">school</i>
                    MarkAttendie
                </h3>

                <p class="flow-text">
                    Blockchain-based Attendance System
                </p>

            </div>
        </div>


        <!-- ERROR MESSAGE -->
        {% if error %}
        <div class="row">
            <div class="col s12">

                <div class="card-panel red lighten-4 red-text text-darken-2">

                    <i class="material-icons left">error</i>

                    {{ error }}

                </div>

            </div>
        </div>
        {% endif %}


        <!-- TEACHER NAME FORM -->
        <div class="row">

            <form action="/" method="POST" class="col s12" id="attendanceForm">

                <div class="row">

                    <div class="input-field col s12">

                        <i class="material-icons prefix">
                            account_circle
                        </i>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >

                        <label for="name">
                            Enter Teacher Name
                        </label>

                    </div>

                </div>


                <!-- START ATTENDANCE BUTTON -->
                <div class="row">

                    <div class="col s12 center-align">

                        <button
                            class="btn waves-effect waves-light blue"
                            type="submit"
                            id="startButton"
                        >

                            Start Attendance

                            <i class="material-icons right">
                                send
                            </i>

                        </button>

                    </div>

                </div>

            </form>

        </div>


        <!-- OTHER ACTIONS -->
        <div class="row">

            <div class="col s12 center-align">

                <div class="card">

                    <div class="card-content">

                        <span class="card-title">
                            Other Actions
                        </span>

                        <div class="row">

                            <!-- VIEW RECORDS -->
                            <div class="col s12 m6">

                                <a
                                    class="btn waves-effect waves-light green"
                                    href="/view.html"
                                >

                                    <i class="material-icons left">
                                        search
                                    </i>

                                    View Records

                                </a>

                            </div>


                            <!-- CHECK INTEGRITY -->
                            <div class="col s12 m6">

                                <a
                                    class="btn waves-effect waves-light orange"
                                    href="/result.html"
                                >

                                    <i class="material-icons left">
                                        security
                                    </i>

                                    Check Integrity

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- MATERIALIZE JS -->
    <script
        type="text/javascript"
        src="{{ url_for('static', filename='js/materialize.js') }}">
    </script>


    <script>

        // Initialize Materialize components
        M.AutoInit();


        // Get form and teacher name input
        const form = document.getElementById("attendanceForm");
        const nameInput = document.getElementById("name");


        // Validate before submitting
        form.addEventListener("submit", function(event) {

            const teacherName = nameInput.value.trim();

            if (teacherName === "") {

                event.preventDefault();

                nameInput.focus();

                M.toast({
                    html: "Please enter Teacher Name",
                    classes: "red"
                });

                return false;
            }

            // Put trimmed value back into the form
            nameInput.value = teacherName;

        });

    </script>

</body>
</html>
